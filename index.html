<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Coaching Class Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#dde1e8;--ac:#1f5eff;--ok:#12805c;--no:#c0392b;--hl:#fff200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171d;--card:#1d222b;--tx:#eceff4;--mu:#9aa3b2;--bd:#323946;--ac:#6b93ff;--ok:#3ecf9b;--no:#ff7a6b}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#2b2b1a;color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;color:#cfcfa8;font-size:13px}
nav{display:flex;gap:6px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.b{padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.sm{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills label{margin:0}
.pill{padding:7px 12px;border:1px solid var(--bd);border-radius:20px;cursor:pointer;color:var(--tx);font-size:13px;background:var(--bg)}
.pill.on{background:var(--hl);color:#222;border-color:#b5ab00;font-weight:600}
.stu{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd)}
.stu .t{display:flex;gap:4px}.stu button{padding:4px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);cursor:pointer}
.stu button.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}.stu button.A.on{background:var(--no);color:#fff;border-color:var(--no)}
.list{max-height:340px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ph div{border:2px dashed var(--bd);border-radius:10px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:12px;color:var(--mu)}
.ph img{max-width:100%;max-height:170px;border-radius:6px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center}th{background:var(--hl);color:#222}td.l,th.l{text-align:left}
.c0{color:var(--no)}.c1{color:var(--ok);font-weight:600}.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);font-size:12px}
.msg{padding:9px;border-radius:8px;margin:8px 0;background:var(--bg);border:1px solid var(--bd)}.err{color:var(--no)}
.ent{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.rep img{width:48%;border-radius:6px;margin:2px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>if(typeof firebase==="undefined"){["app","auth","firestore"].forEach(function(n){document.write('<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-'+n+'-compat.js"><\/script>')})}</script></head><body>
<header><button id="so" style="float:right;padding:5px 10px;border-radius:6px;border:1px solid #888;background:transparent;color:#fff;cursor:pointer">Sign out</button><h1>Coaching Class Tracker</h1><p>Department-wise proof of coaching classes · Oct 2026</p></header>
<nav><button data-v="entry" class="on">New entry</button><button data-v="dash">Progress</button><button data-v="rep">Reports</button></nav>
<main id="m"></main>
<script>
const CLASSES=["CSE-A","CSE-B","CSE-C","AI&DS-A","AI&DS-B","ECE-A","ECE-B","MECH","IT-A","IT-B","CSBS","CYS","AI&ML-A","AI&ML-B","R&A"];
const WEEKS=[{n:1,a:"2026-10-05",b:"2026-10-10"},{n:2,a:"2026-10-12",b:"2026-10-17"},{n:3,a:"2026-10-21",b:"2026-10-26"},{n:4,a:"2026-10-26",b:"2026-10-30"}];
const HOURS=["Regular hour","Seminar hour","PED hour","Library hour"];
const PERIODS=["1 · 08:30–09:20","2 · 09:20–10:10","3 · 10:30–11:20","4 · 11:20–12:10","5 · 01:00–01:50","6 · 01:50–02:40","7 · 02:50–03:40","8 · 03:40–04:30"];
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>{const[y,m,dd]=d.split("-");return dd+"."+m+"."+y.slice(2)};
let view="entry",db=null,assets=null,dl=null,uid=null,entries=[],msg="";
let F={fac:"",cls:"",week:1,date:WEEKS[0].a,hour:HOURS[0],period:PERIODS[0],subj:"",topic:"",stu:[],photos:[],busy:false};
let R={cls:"",week:"",open:null};

const firebaseConfig={apiKey:"AIzaSyDo3Qxw-ThJRz-KorLejWqBDw0ikwC-w1Y",authDomain:"coaching-tracker-e9a12.firebaseapp.com",projectId:"coaching-tracker-e9a12",storageBucket:"coaching-tracker-e9a12.firebasestorage.app",messagingSenderId:"1091374044144",appId:"1:1091374044144:web:8c019049e30771d81fc335"};
const DOMAIN=""; /* e.g. "kgkite.ac.in" - only this email domain may sign in. Leave "" to allow any Google account (the Firestore rules still decide). */
if(typeof firebase==="undefined"){$("#m").innerHTML='<div class="card"><h2>Cannot load Firebase</h2><div class="msg err">The Firebase scripts were blocked or could not load. Open this page from its https://&lt;name&gt;.github.io address in a normal browser tab with internet access, turn off ad-blockers for this page, then reload.</div></div>';throw new Error("firebase not loaded")}
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),fs=firebase.firestore();db=fs;
assets={upload:async b=>({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),url:await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})})};
dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return "saved"}};
let unsub=null,unsub2=null;
function loginUI(note){$("#m").innerHTML=`<div class="card" style="text-align:center"><h2>Sign in</h2><p class="mu">Use your college Google account.</p><button class="b p" id="gl">Sign in with Google</button>${note?`<div class="msg err">${esc(note)}</div>`:""}</div>`;$("#gl").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>loginUI(e.message))}
const _r0=render;render=function(){if(!uid)return loginUI();_r0()};
$("#so").onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{if(unsub){unsub();unsub=null}if(unsub2){unsub2();unsub2=null}
 if(!u){uid=null;return loginUI()}
 if(DOMAIN&&!(u.email||"").toLowerCase().endsWith("@"+DOMAIN)){auth.signOut();return loginUI("Please use your @"+DOMAIN+" account.")}
 uid=u.uid;F.fac=F.fac||u.displayName||"";
 unsub2=fs.collection("settings").doc("weeks").onSnapshot(d=>{WEEKS.length=4;((d.data()||{}).list||[]).filter(w=>w.n>4).sort((x,y)=>x.n-y.n).forEach(w=>WEEKS.push(w));if(view!=="entry")render()},e=>{});unsub=(isAdmin()?fs.collection("sessions"):fs.collection("sessions").where("by","==",uid)).onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));if(view!=="entry")render()},e=>{msg="Data error: "+e.message;render()});render()});

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});

function render(){const m=$("#m");if(view==="entry")return entryView(m);if(view==="dash")return dashView(m);repView(m)}

function entryView(m){const w=WEEKS[F.week-1];
 m.innerHTML=`${msg?`<div class="msg">${esc(msg)}</div>`:""}
 <div class="card"><h2>1 · Class details</h2><div class="grid">
 <div><label>Faculty name</label><input id="fac" value="${esc(F.fac)}" placeholder="Your name"></div>
 <div><label>Class</label><select id="cls"><option value="">Select class</option>${CLASSES.map(c=>`<option ${c==F.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <div><label>Week</label><select id="week">${WEEKS.map(x=>`<option value="${x.n}" ${x.n==F.week?"selected":""}>Week ${x.n} · ${fmt(x.a)} to ${fmt(x.b)}</option>`).join("")}</select></div>
 <div><label>Date</label><input type="date" id="date" min="${w.a}" max="${w.b}" value="${F.date}"></div>
 <div><label>Period (timetable)</label><select id="period">${PERIODS.map(p=>`<option ${p==F.period?"selected":""}>${p}</option>`).join("")}</select></div>
 <div><label>Subject</label><input id="subj" value="${esc(F.subj)}"></div></div>
 <label style="margin-top:10px">Hour type</label><div class="pills">${HOURS.map(h=>`<span class="pill ${h==F.hour?"on":""}" data-h="${h}">${h}</span>`).join("")}</div>
 <label style="margin-top:10px">Topic covered</label><textarea id="topic" rows="2">${esc(F.topic)}</textarea></div>
 <div class="card"><h2>2 · Attendance <span class="mu" id="cnt"></span></h2>
 <div class="row noprint"><label class="b" style="margin:0;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer">Upload name list (CSV / TXT)<input type="file" id="nf" accept=".csv,.txt" hidden></label>
 <button class="b sm" id="allP">All present</button><button class="b sm" id="allA">All absent</button></div>
 <div class="row" style="margin:8px 0"><input id="paste" style="flex:1;min-width:160px" placeholder="Or add a name / paste names (one per line)"><button class="b sm" id="addN">Add</button></div>
 <div class="mu" style="margin-bottom:6px">One name per line (roll no. and name can be separated by a comma). Default is present – tap A for absentees.</div>
 <div class="list" id="stl"></div></div>
 <div class="card"><h2>3 · Geotag photo proof (2 required)</h2><div class="ph" id="ph"></div><div class="mu" style="margin-top:6px">Photos are stamped with GPS location and time. Allow location access when asked.</div></div>
 <div class="row"><button class="b p" id="save">Submit entry</button><button class="b" id="reset">Clear form</button></div><div id="fm"></div>`;
 const bind=(id,k,ev="input")=>$("#"+id).addEventListener(ev,e=>F[k]=e.target.value);
 bind("fac","fac");bind("cls","cls","change");bind("subj","subj");bind("topic","topic");bind("period","period","change");bind("date","date","change");
 $("#week").onchange=e=>{F.week=+e.target.value;F.date=WEEKS[F.week-1].a;entryView(m)};
 m.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{F.hour=p.dataset.h;m.querySelectorAll(".pill").forEach(x=>x.classList.toggle("on",x===p))});
 $("#nf").onchange=async e=>{const f=e.target.files[0];if(f)addNames(await f.text(),true)};
 $("#addN").onclick=()=>{addNames($("#paste").value);$("#paste").value=""};
 $("#allP").onclick=()=>{F.stu.forEach(s=>s.p=true);stu()};$("#allA").onclick=()=>{F.stu.forEach(s=>s.p=false);stu()};
 $("#save").onclick=save;$("#reset").onclick=()=>{if(confirm("Clear the form?")){F={...F,subj:"",topic:"",stu:[],photos:[]};entryView(m)}};
 stu();photos()}

function addNames(t,replace){let L=t.split(/\r?\n/).map(l=>l.split(",").map(c=>c.replace(/^["'\s]+|["'\s]+$/g,"")).filter(Boolean).join(" – ")).filter(Boolean);
 if(L.length&&/^(s\.?\s?no|sl|name|roll|reg)/i.test(L[0]))L.shift();
 if(replace)F.stu=[];L.forEach(n=>F.stu.push({n,p:true}));stu()}
function stu(){const el=$("#stl");if(!el)return;
 el.innerHTML=F.stu.length?F.stu.map((s,i)=>`<div class="stu"><span>${i+1}. ${esc(s.n)}</span><span class="t"><button class="P ${s.p?"on":""}" data-i="${i}" data-v="1">P</button><button class="A ${s.p?"":"on"}" data-i="${i}" data-v="0">A</button><button data-d="${i}" title="Remove">×</button></span></div>`).join(""):`<div class="stu mu">No students yet – upload the name list above.</div>`;
 el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{F.stu[+b.dataset.i].p=b.dataset.v==="1";stu()});
 el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{F.stu.splice(+b.dataset.d,1);stu()});
 const p=F.stu.filter(s=>s.p).length;$("#cnt").textContent=F.stu.length?`— Present ${p} · Absent ${F.stu.length-p} · Total ${F.stu.length}`:""}

function photos(){$("#ph").innerHTML=[0,1].map(i=>{const p=F.photos[i];return `<div>${p?`<img src="${p.url}"><span>${p.lat!=null?`📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`:"⚠ location unavailable"}</span><button class="b sm" data-r="${i}">Remove</button>`:`<span>Photo ${i+1}</span><label class="b sm" style="margin:6px 0;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer">${F.busy?"Uploading…":"Take / choose photo"}<input type="file" accept="image/*" capture="environment" hidden data-i="${i}"></label>`}</div>`}).join("");
 document.querySelectorAll("#ph input").forEach(x=>x.onchange=e=>addPhoto(e.target.files[0],+x.dataset.i));
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{F.photos.splice(+b.dataset.r,1);photos()})}

function getPos(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{timeout:8000,enableHighAccuracy:true})})}
async function addPhoto(file,i){if(!file)return;if(!assets){$("#fm").innerHTML='<div class="msg err">Photo upload is not available – open this page in claude.ai while signed in.</div>';return}
 F.busy=true;photos();try{const pos=await getPos();const img=await createImageBitmap(file);const s=Math.min(1,800/Math.max(img.width,img.height));
 const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);
 const ts=new Date().toLocaleString("en-IN");const txt=(pos?`Lat ${pos.latitude.toFixed(5)}  Lon ${pos.longitude.toFixed(5)}`:"Location unavailable")+"  |  "+ts;
 const fs=Math.max(14,c.width/38);x.font=`bold ${fs}px sans-serif`;x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,c.height-fs*1.8,c.width,fs*1.8);x.fillStyle="#fff";x.fillText(txt,fs*.5,c.height-fs*.6);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.6));const up=await assets.upload(blob);
 F.photos[i]={id:up.id,url:up.url,lat:pos?pos.latitude:null,lng:pos?pos.longitude:null,ts:Date.now()}}catch(e){$("#fm").innerHTML=`<div class="msg err">Upload failed: ${esc(e.message||e.code)}</div>`}
 F.busy=false;photos()}

async function save(){const e=[];if(!F.fac.trim())e.push("faculty name");if(!F.cls)e.push("class");if(!F.subj.trim())e.push("subject");if(!F.topic.trim())e.push("topic");if(!F.stu.length)e.push("attendance list");if(F.photos.filter(Boolean).length<2)e.push("2 geotag photos");
 if(e.length){$("#fm").innerHTML=`<div class="msg err">Please add: ${e.join(", ")}.</div>`;return}
 if(!db){$("#fm").innerHTML='<div class="msg err">Not connected – open in claude.ai while signed in.</div>';return}
 try{const id="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 await db.collection("sessions").doc(id).set({fac:F.fac.trim(),cls:F.cls,week:F.week,date:F.date,hour:F.hour,period:F.period,subj:F.subj.trim(),topic:F.topic.trim(),stu:F.stu,photos:F.photos,by:uid,byEmail:(auth.currentUser||{}).email||"",at:Date.now()});
 F={...F,topic:"",stu:F.stu.map(s=>({...s,p:true})),photos:[]};F.date=nextDate();msg="✔ Entry submitted. Subject, course details and the student list are kept for the next date: change the date if needed, mark attendance, add the new topic and photos.";entryView($("#m"));msg=""}catch(x){$("#fm").innerHTML=`<div class="msg err">Save failed: ${esc(x.message||x.code)}</div>`}}

function dashView(m){const rows=CLASSES.map(c=>`<tr><td class="l"><b>${esc(c)}</b></td>${WEEKS.map(w=>{const n=entries.filter(e=>e.cls===c&&e.week===w.n).length;return `<td class="${n?"c1":"c0"}">${n||"–"}</td>`}).join("")}<td>${entries.filter(e=>e.cls===c).length}</td></tr>`).join("");
 m.innerHTML=`<div class="card"><h2>Entries submitted per class</h2><div class="mu" style="margin-bottom:8px">Total entries: ${entries.length}. A dash means nothing has been submitted for that week.</div><div class="sc"><table><tr><th class="l">Class</th>${WEEKS.map(w=>`<th>Wk ${w.n}<br><span style="font-weight:400">${fmt(w.a).slice(0,5)}–${fmt(w.b).slice(0,5)}</span></th>`).join("")}<th>Total</th></tr>${rows}</table></div></div>`}

const stats=e=>{const p=(e.stu||[]).filter(s=>s.p).length;return{p,a:(e.stu||[]).length-p,t:(e.stu||[]).length}};
function entryHTML(e,img){const s=stats(e);return `<div class="rep"><h3 style="margin:0">${esc(e.cls)} · ${esc(e.hour)} · Week ${e.week}</h3>
<p class="mu">${fmt(e.date)} · Period ${esc(e.period)} · Faculty: ${esc(e.fac)}</p><p><b>Subject:</b> ${esc(e.subj)}<br><b>Topic:</b> ${esc(e.topic)}</p>
<p><b>Attendance:</b> Present ${s.p} · Absent ${s.a} · Total ${s.t}</p>
<table><tr><th>#</th><th class="l">Name</th><th>Status</th></tr>${e.stu.map((x,i)=>`<tr><td>${i+1}</td><td class="l">${esc(x.n)}</td><td class="${x.p?"c1":"c0"}">${x.p?"Present":"Absent"}</td></tr>`).join("")}</table>
<h4>4. Geotag photo proof</h4>${(e.photos||[]).map(p=>`<div style="display:inline-block;width:48%;vertical-align:top"><img src="${img(p)}" style="width:100%;border-radius:6px"><div class="mu">${p.lat!=null?`📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`:"Location unavailable"} · ${new Date(p.ts).toLocaleString("en-IN")}</div></div>`).join(" ")}</div>`}

function repView(m){let L=entries.filter(e=>(!R.cls||e.cls===R.cls)&&(!R.week||e.week==R.week)).sort((a,b)=>a.date<b.date?1:-1);
 m.innerHTML=`<div class="card noprint"><h2>Reports</h2><div class="grid"><div><label>Class</label><select id="rc"><option value="">All classes</option>${CLASSES.map(c=>`<option ${c==R.cls?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <div><label>Week</label><select id="rw"><option value="">All weeks</option>${WEEKS.map(w=>`<option value="${w.n}" ${w.n==R.week?"selected":""}>Week ${w.n}</option>`).join("")}</select></div></div>
 <div class="row" style="margin-top:10px"><button class="b" id="csv">Download summary (CSV)</button></div></div>
 ${L.length?L.map(e=>{const s=stats(e);return `<div class="ent" data-id="${e.id}"><div class="row" style="justify-content:space-between"><div><b>${esc(e.cls)}</b> <span class="tag">${esc(e.hour)}</span> <span class="tag">Wk ${e.week}</span><div class="mu">${fmt(e.date)} · ${esc(e.fac)} · ${esc(e.subj)} · P ${s.p}/A ${s.a}</div></div><div class="row noprint"><button class="b sm" data-o="${e.id}">${R.open===e.id?"Close":"View report"}</button></div></div>${R.open===e.id?`<div class="card" style="margin-top:8px">${entryHTML(e,p=>p.url)}<div class="row noprint"><button class="b p sm" id="pr">Print / Save PDF</button><button class="b sm" id="dh">Download report (HTML with photos)</button></div></div>`:""}</div>`}).join(""):`<div class="card mu">No entries yet.</div>`}`;
 $("#rc").onchange=e=>{R.cls=e.target.value;repView(m)};$("#rw").onchange=e=>{R.week=e.target.value;repView(m)};
 m.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{R.open=R.open===b.dataset.o?null:b.dataset.o;repView(m)});
 const pr=$("#pr");if(pr)pr.onclick=()=>window.print();
 const dh=$("#dh");if(dh)dh.onclick=()=>dlHtml(entries.find(e=>e.id===R.open));
 $("#csv").onclick=()=>{const h="Date,Week,Class,Hour type,Period,Faculty,Subject,Topic,Present,Absent,Total,Photos\n";const q=v=>'"'+String(v).replace(/"/g,'""')+'"';

const isReg=c=>/^\d{6,}\S*$/.test(c)||/^\d{5,}[A-Za-z]\S*$/.test(c);
const isNum=c=>/^\d+(\.\d+)?$/.test(c);
const nz=s=>(/^\d{1,4}$/.test(s.r||"")&&isReg(s.m||""))?{...s,r:s.m,m:""}:s;
const fd=d=>fmt(d).replace(/\./g,"/"),sk=s=>nz(s).r||s.n;
const _ev=entryView;
entryView=function(m){_ev(m);const x=document.createElement("div");x.className="card";
 x.innerHTML=`<h2>Course &amp; report details</h2><div class="grid">
 <div><label>Designation</label><input id="x_desig" value="${esc(F.desig||"")}" placeholder="AP / ASP / Prof"></div>
 <div><label>Course code</label><input id="x_code" value="${esc(F.code||"")}"></div>
 <div><label>Year / Sem</label><input id="x_ysem" value="${esc(F.ysem||"I/II")}"></div>
 <div><label>Mode of coaching</label><select id="x_mode">${["Coaching Class","Assignment","Retest","Seminar"].map(o=>`<option ${o==(F.mode||"Coaching Class")?"selected":""}>${o}</option>`).join("")}</select></div></div>
 <label style="margin-top:10px">Details of the implementation (report)</label><textarea id="x_impl" rows="3">${esc(F.impl||"")}</textarea>
 <label style="margin-top:10px">Strategy plan – before &amp; after</label><textarea id="x_strat" rows="3" placeholder="1. Before: ...&#10;2. After: ...">${esc(F.strat||"")}</textarea>`;
 m.querySelector(".card").after(x);
 ["desig","code","ysem","mode","impl","strat"].forEach(k=>{const el=$("#x_"+k);el.oninput=el.onchange=e=>F[k]=e.target.value})};
addNames=function(t,replace){let L=t.split(/\r?\n/).map(l=>l.split(",").map(c=>c.replace(/^["'\s]+|["'\s]+$/g,"")).filter(Boolean)).filter(a=>a.length);
 if(L.length&&/^(s\.?\s?no|sl|name|roll|reg)/i.test(L[0][0]))L.shift();if(replace)F.stu=[];
 L.forEach(a=>{let r="",n="",m="";a.forEach((c,i)=>{if(isReg(c)){if(!r)r=c}else if(isNum(c)){if(i===0&&a.length>1)return;m=c}else if(!n)n=c});
  if(!n)n=a.find(c=>!isReg(c)&&!isNum(c))||a[0];F.stu.push({r,n,m,p:true})});stu()};
stu=function(){const el=$("#stl");if(!el)return;
 el.innerHTML=F.stu.length?F.stu.map((s,i)=>`<div class="stu"><span>${i+1}. ${esc(s.r?s.r+" – ":"")}${esc(s.n)}</span><span class="t"><input data-m="${i}" value="${esc(s.m||"")}" placeholder="Mark" inputmode="numeric" style="width:64px;padding:4px 6px;margin-right:6px"><button class="P ${s.p?"on":""}" data-i="${i}" data-v="1">P</button><button class="A ${s.p?"":"on"}" data-i="${i}" data-v="0">A</button><button data-d="${i}" title="Remove">×</button></span></div>`).join(""):`<div class="stu mu">No students yet – upload the name list above (columns: register no, name, internal mark).</div>`;
 el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{F.stu[+b.dataset.i].p=b.dataset.v==="1";stu()});
